name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly against the moving upstream version-16 branches
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ github.event_name == 'schedule' && 'upstream version-16' || 'pinned v16.53.0' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Pinned on push/PR; moving branches on the nightly schedule.
      ERPNEXT_REF: ${{ github.event_name == 'schedule' && 'version-16' || 'v16.53.0' }}
      FRAPPE_REF: ${{ github.event_name == 'schedule' && 'version-16' || 'v16.55.1' }}

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis-cache:
        image: redis:6.2-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:6.2-alpine
        ports:
          - 11000:6379

    # NOTE: this CI site has no woocommerce_fusion installed, so the
    # test_without_woocommerce guard runs fully here (create_branch path + import check).
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcups2-dev redis-tools mariadb-client

      - name: Install bench
        run: pip install frappe-bench

      - name: Init bench
        run: |
          bench init --skip-redis-config-generation --skip-assets --frappe-branch "$FRAPPE_REF" --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          bench get-app erpnext --branch "$ERPNEXT_REF" --resolve-deps
          bench get-app mizan_core https://github.com/rafeaabdallah93-debug/mizan_core --branch main
          bench get-app mizan_retail "$GITHUB_WORKSPACE"

      - name: Create site
        working-directory: /home/runner/frappe-bench
        run: |
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000
          bench new-site test_site --db-root-password root --admin-password admin --install-app erpnext --install-app mizan_core --install-app mizan_retail
          bench --site test_site set-config allow_tests true

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app mizan_retail
